<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baby Announcement Maker</title>
<style>
  :root {
    --pink: #ff8fab;
    --blue: #7fb8f0;
    --cream: #fff7f0;
    --gold: #e8b64c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0e9f7;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 24px;
    justify-content: center;
  }
  .panel {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }
  .panel h2 { margin-top: 0; font-size: 20px; color: #444; }
  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 12px 0 4px; }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"], select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .radio-group { display: flex; gap: 16px; margin-top: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: normal; margin: 0; }
  input[type="file"] { width: 100%; margin-top: 4px; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
  }
  #downloadBtn { background: linear-gradient(135deg, var(--pink), var(--blue)); }
  #printBtn { background: #888; margin-top: 8px; }

  /* ---- Card ---- */
  /* card keeps its true 500x700 size for a crisp PNG export; #cardScaleBox
     visually shrinks it via JS transform so it fits small screens */
  #cardWrapper { width: 100%; display: flex; justify-content: center; }
  #cardScaleBox { position: relative; }
  #card {
    width: 500px;
    min-height: 700px;
    background: linear-gradient(160deg, var(--cream) 0%, #ffe9f2 100%);
    border-radius: 24px;
    padding: 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    border: 6px solid #fff;
    transform-origin: top left;
  }
  #card.theme-boy {
    background: linear-gradient(160deg, #eaf4ff 0%, #cfe8ff 100%);
  }
  #card.theme-girl {
    background: linear-gradient(160deg, var(--cream) 0%, #ffe9f2 100%);
  }
  #card::before, #card::after {
    content: "✦";
    position: absolute;
    color: var(--gold);
    font-size: 22px;
    opacity: 0.6;
  }
  #card::before { top: 16px; left: 20px; }
  #card::after { top: 16px; right: 20px; }

  /* ---- Theme decorations (generic, non-branded icons) ---- */
  .theme-decorations {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .theme-decorations span {
    position: absolute;
    font-size: 34px;
    opacity: 0.28;
  }
  /* icons only sit along the outer edges so they never cover the photo/text */
  .deco-1 { top: 80px;   left: 12px; }
  .deco-2 { top: 150px;  right: 8px; font-size: 28px; }
  .deco-3 { top: 230px;  left: 6px;  font-size: 26px; }
  .deco-4 { bottom: 190px; right: 10px; }
  .deco-5 { bottom: 20px; left: 24px; font-size: 26px; }
  .deco-6 { bottom: 20px; right: 28px; font-size: 26px; }

  .title {
    text-align: center;
    font-size: 26px;
    letter-spacing: 2px;
    color: #b5548a;
    font-weight: 800;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  .photo-frame {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: #fff repeating-linear-gradient(45deg, #f2f2f2, #f2f2f2 10px, #fafafa 10px, #fafafa 20px);
    border: 6px solid #fff;
    outline: 3px dashed var(--pink);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
  .photo-frame span { color: #bbb; font-size: 13px; text-align: center; padding: 10px; }
  .baby-name {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #444;
    margin-bottom: 4px;
    position: relative;
    z-index: 1;
  }
  .gender-tag {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .gender-tag.boy { color: var(--blue); }
  .gender-tag.girl { color: var(--pink); }

  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    background: rgba(255,255,255,0.7);
    border-radius: 16px;
    padding: 16px 20px;
    position: relative;
    z-index: 1;
  }
  .detail-item { text-align: left; }
  .detail-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a98ab5;
    font-weight: 700;
  }
  .detail-value {
    font-size: 16px;
    color: #444;
    font-weight: 600;
  }
  .full-width { grid-column: 1 / -1; }
  .footer-note {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #b5548a;
    font-style: italic;
    position: relative;
    z-index: 1;
  }
  .parents-note {
    text-align: center;
    margin-top: 10px;
    position: relative;
    z-index: 1;
  }
  .parents-note .detail-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #a98ab5;
    font-weight: 700;
  }
  .parents-note .detail-value {
    font-size: 16px;
    color: #444;
    font-weight: 600;
  }

  @media print {
    body * { visibility: hidden; }
    #card, #card * { visibility: visible; }
    #card { position: fixed; top: 0; left: 0; transform: none !important; box-shadow: none; }
    .panel { display: none; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; gap: 16px; }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>

  <div class="panel">
    <h2>👶 Enter Baby Details</h2>

    <label>Baby's Photo</label>
    <input type="file" id="photoInput" accept="image/*">

    <label>Baby's Name (optional)</label>
    <input type="text" id="babyName" placeholder="e.g. Baby Aarav">

    <label>Gender</label>
    <select id="gender">
      <option value="Boy">Boy</option>
      <option value="Girl">Girl</option>
    </select>

    <div class="row">
      <div>
        <label>Weight</label>
        <input type="text" id="weight" placeholder="e.g. 3.2 kg">
      </div>
      <div>
        <label>Length</label>
        <input type="text" id="length" placeholder="e.g. 50 cm">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Date of Birth</label>
        <input type="date" id="dob">
      </div>
      <div>
        <label>Time of Birth</label>
        <input type="time" id="tob">
      </div>
    </div>

    <label>Blood Group</label>
    <select id="bloodGroup">
      <option>A+</option><option>A-</option>
      <option>B+</option><option>B-</option>
      <option>AB+</option><option>AB-</option>
      <option>O+</option><option>O-</option>
      <option>Unknown</option>
    </select>

    <label>Delivery Type</label>
    <div class="radio-group">
      <label><input type="radio" name="delivery" value="Normal Delivery" checked> Normal</label>
      <label><input type="radio" name="delivery" value="C-Section"> C-Section</label>
    </div>

    <label>Parents' Names (optional)</label>
    <input type="text" id="parents" placeholder="e.g. John & Jane">

    <button id="downloadBtn">⬇️ Download as Image (PNG)</button>
    <button id="printBtn">🖨️ Print / Save as PDF</button>
  </div>

  <div id="cardWrapper">
    <div id="cardScaleBox">
    <div id="card" class="theme-boy">
      <div class="theme-decorations" id="themeDecorations">
        <span class="deco-1">🚜</span>
        <span class="deco-2">🚧</span>
        <span class="deco-3">🏗️</span>
        <span class="deco-4">🚚</span>
        <span class="deco-5">⚙️</span>
        <span class="deco-6">🚦</span>
      </div>
      <div class="title">Welcome to the World</div>
      <div class="subtitle">Birth Announcement</div>

      <div class="photo-frame" id="photoFrame">
        <span>Baby's photo will appear here</span>
      </div>

      <div class="baby-name" id="outName">Our Little Miracle</div>
      <div class="gender-tag boy" id="outGender">👶 Boy</div>

      <div class="details-grid">
        <div class="detail-item">
          <div class="detail-label">Date of Birth</div>
          <div class="detail-value" id="outDob">--</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Time of Birth</div>
          <div class="detail-value" id="outTob">--</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Weight</div>
          <div class="detail-value" id="outWeight">--</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Length</div>
          <div class="detail-value" id="outLength">--</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Blood Group</div>
          <div class="detail-value" id="outBlood">--</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Delivery Type</div>
          <div class="detail-value" id="outDelivery">Normal Delivery</div>
        </div>
      </div>

      <div class="footer-note">With love & blessings 💕</div>
      <div class="parents-note" id="parentsRow" style="display:none;">
        <span class="detail-label">Parents</span>
        <span class="detail-value" id="outParents">--</span>
      </div>
    </div>
    </div>
  </div>

  <!-- html2canvas used only for the PNG export feature -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // generic (non-branded) icon sets so no copyrighted characters/logos are used
    const BOY_ICONS = ['🚜', '🚧', '🏗️', '🚚', '⚙️', '🚦'];
    const GIRL_ICONS = ['👑', '❄️', '🏰', '✨', '👠', '🌊'];

    function applyTheme(gender) {
      const card = $('card');
      const isBoy = gender === 'Boy';
      card.classList.toggle('theme-boy', isBoy);
      card.classList.toggle('theme-girl', !isBoy);

      const icons = isBoy ? BOY_ICONS : GIRL_ICONS;
      document.querySelectorAll('#themeDecorations span').forEach((span, i) => {
        span.textContent = icons[i] || '';
      });
    }

    function formatDate(value) {
      if (!value) return '--';
      const d = new Date(value + 'T00:00:00');
      return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
    }
    function formatTime(value) {
      if (!value) return '--';
      const [h, m] = value.split(':');
      const d = new Date();
      d.setHours(+h, +m);
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    function update() {
      const name = $('babyName').value.trim();
      $('outName').textContent = name || 'Our Little Miracle';

      const gender = $('gender').value;
      const genderEl = $('outGender');
      genderEl.textContent = gender === 'Boy' ? "👶 It's a Boy!" : "👶 It's a Girl!";
      genderEl.className = 'gender-tag ' + (gender === 'Boy' ? 'boy' : 'girl');
      applyTheme(gender);

      $('outDob').textContent = formatDate($('dob').value);
      $('outTob').textContent = formatTime($('tob').value);
      $('outWeight').textContent = $('weight').value.trim() || '--';
      $('outLength').textContent = $('length').value.trim() || '--';
      $('outBlood').textContent = $('bloodGroup').value;

      const delivery = document.querySelector('input[name="delivery"]:checked').value;
      $('outDelivery').textContent = delivery;

      const parents = $('parents').value.trim();
      $('parentsRow').style.display = parents ? 'block' : 'none';
      $('outParents').textContent = parents;

      fitCardToViewport();
      saveToStorage();
    }

    // ---- Mobile responsiveness: shrink the card visually without changing
    // its true 500x700 layout, so exported PNGs stay full resolution ----
    const CARD_WIDTH = 500;
    function fitCardToViewport() {
      const card = $('card');
      const scaleBox = $('cardScaleBox');
      const available = Math.min(window.innerWidth - 32, CARD_WIDTH);
      const scale = Math.min(1, available / CARD_WIDTH);
      card.style.transform = 'scale(' + scale + ')';
      scaleBox.style.width = (CARD_WIDTH * scale) + 'px';
      scaleBox.style.height = (card.offsetHeight * scale) + 'px';
    }
    window.addEventListener('resize', fitCardToViewport);

    // ---- Reliability: autosave form data locally so a refresh doesn't lose it ----
    const STORAGE_KEY = 'babyAnnouncementForm';
    function saveToStorage() {
      const data = {
        babyName: $('babyName').value,
        gender: $('gender').value,
        weight: $('weight').value,
        length: $('length').value,
        dob: $('dob').value,
        tob: $('tob').value,
        bloodGroup: $('bloodGroup').value,
        delivery: document.querySelector('input[name="delivery"]:checked').value,
        parents: $('parents').value,
        photo: $('photoFrame').querySelector('img')?.src || ''
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // likely quota exceeded because of a large photo - retry without it
        try {
          data.photo = '';
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e2) { /* autosave unavailable, safe to ignore */ }
      }
    }
    function restoreFromStorage() {
      let data;
      try {
        data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      } catch (e) { return; }
      if (!data) return;
      $('babyName').value = data.babyName || '';
      $('gender').value = data.gender || 'Boy';
      $('weight').value = data.weight || '';
      $('length').value = data.length || '';
      $('dob').value = data.dob || '';
      $('tob').value = data.tob || '';
      $('bloodGroup').value = data.bloodGroup || 'A+';
      $('parents').value = data.parents || '';
      const deliveryRadio = document.querySelector('input[name="delivery"][value="' + data.delivery + '"]');
      if (deliveryRadio) deliveryRadio.checked = true;
      if (data.photo) {
        $('photoFrame').innerHTML = '<img src="' + data.photo + '" alt="baby photo">';
      }
    }

    document.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', update);
      el.addEventListener('change', update);
    });

    $('photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        $('photoFrame').innerHTML = `<img src="${ev.target.result}" alt="baby photo">`;
      };
      reader.readAsDataURL(file);
    });

    $('downloadBtn').addEventListener('click', () => {
      if (typeof html2canvas === 'undefined') {
        alert('The image export library failed to load (likely no internet connection). Please use the "Print / Save as PDF" button instead.');
        return;
      }
      const card = $('card');
      const prevTransform = card.style.transform;
      card.style.transform = 'none';
      html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        card.style.transform = prevTransform;
        const link = document.createElement('a');
        link.download = 'baby-announcement.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(() => {
        card.style.transform = prevTransform;
        alert('Something went wrong creating the image. Please try the "Print / Save as PDF" button instead.');
      });
    });

    $('printBtn').addEventListener('click', () => window.print());

    restoreFromStorage();
    update();
  </script>
</body>
</html>
